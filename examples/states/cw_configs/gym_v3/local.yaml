
# Global config
exp_name: &exp_name "gym_v3"
exp_path: &exp_path "../../../qsm_exp_result"
sub_exp_name: &sub_exp_name "First try"

# cw2 config
name: *exp_name
path: *exp_path
repetitions: 1
reps_per_job: 1
reps_in_parallel: 1

# experiment parameters
params:
  wandb:
    project: *exp_name
    group: *sub_exp_name
  env_id: "Ant-v3"
  denoising_steps: 15
  alpha: 100
  actor_width: 256
  actor_depth: 3
  critic_width: 2048
  critic_depth: 2